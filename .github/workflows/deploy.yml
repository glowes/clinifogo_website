name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change this to "master" if your default branch is called master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm install
        
      - name: Build CSS from SASS
        run: npm run sass:build
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # We use '.' here because your index.html is in the main root folder, 
          # and the build command just compiles the CSS in place.
          path: '.' 

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
